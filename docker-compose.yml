version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: mentorax-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: mentorax
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - mentorax-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: mentorax-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/mentorax?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-here-make-it-long-and-random
      JWT_EXPIRE: 30d
      JWT_COOKIE_EXPIRE: 30
      CLIENT_URL: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      - mongodb
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - mentorax-network

  # Frontend React App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: mentorax-frontend
    restart: unless-stopped
    environment:
      REACT_APP_BASE_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mentorax-network

  # Redis for Session Management (Optional)
  redis:
    image: redis:7-alpine
    container_name: mentorax-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mentorax-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  mentorax-network:
    driver: bridge